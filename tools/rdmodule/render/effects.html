<body>

</div>

<script type="module">
// Plays the effects exported by export_effects.py: each prefab's particle systems are
// simulated from their extracted settings, its animation clips and Timeline start times are applied, and the ability's
// sounds play with it. An approximation of the game's VFX shader: a grey texture coloured through the material's
// ramp (_MatColor1-5), masked by _MaskTex, additive unless the material blends by alpha.
// ?unit=<key>&prefab=<name>&t=<seconds> shows one moment (paused) for checks.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x202228);
scene.add(new THREE.GridHelper(20, 20, 0x4a4f5a, 0x30343c));
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 500);
camera.position.set(7, 6, 10);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 1, 0); controls.update();
const ui = (id) => document.getElementById(id);

const index = await (await fetch('index.json')).json();
for (const k of Object.keys(index.units)) ui('unit').add(new Option(k, k));

// ---- curves ----------------------------------------------------------------------------------------------------
function curveAt(keys, t) {
  if (!keys || !keys.length) return 1;
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    return v0 + (v1 - v0) * ((t - t0) / Math.max(t1 - t0, 1e-6));
  }
  return keys[keys.length - 1][1];
}
// MinMaxCurve: {const} | {curve, mul} | {minCurve, maxCurve, mul} | {min, max}; t = normalized time, r = random 0..1
function mm(v, t = 0, r = Math.random()) {
  if (!v) return 0;
  if ('const' in v) return v.const;
  if ('curve' in v) return curveAt(v.curve, t) * v.mul;
  if ('minCurve' in v) return (curveAt(v.minCurve, t) + (curveAt(v.maxCurve, t) - curveAt(v.minCurve, t)) * r) * v.mul;
  if ('min' in v) return v.min + (v.max - v.min) * r;
  return 0;
}
function gradAt(g, t) {
  const c = [1, 1, 1], a = g.alphas?.length ? curveAt(g.alphas.map((k) => [k[0], k[1]]), t) : 1;
  if (g.colors?.length) for (let i = 0; i < 3; i++) c[i] = curveAt(g.colors.map((k) => [k[0], k[i + 1]]), t);
  return [...c, a];
}
// MinMaxGradient: {color} | {gradient} | {min, max} | {minGradient, maxGradient} | {randomColor}
function mmColor(v, t, r = Math.random()) {
  if (!v) return [1, 1, 1, 1];
  if (v.color) return v.color;
  if (v.gradient) return gradAt(v.gradient, t);
  if (v.min) return v.min.map((x, i) => x + (v.max[i] - x) * r);
  if (v.minGradient) { const a = gradAt(v.minGradient, t), b = gradAt(v.maxGradient, t); return a.map((x, i) => x + (b[i] - x) * r); }

// ---- materials --------------------------------------------------------------------------------------------------
const texLoader = new THREE.TextureLoader(), texCache = {};
const white = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1); white.needsUpdate = true;
function tex(name) {

const VERT_COMMON = /* glsl */`
  attribute vec3 iOffset; attribute vec3 iSize; attribute vec3 iRot; attribute vec4 iColor; attribute float iFrame; attribute vec3 iVel;
  uniform vec2 uTiles; uniform int uMode;
  varying vec2 vUv; varying vec4 vColor;

    float cx = cos(r.x), sx = sin(r.x), cy = cos(r.y), sy = sin(r.y), cz = cos(r.z), sz = sin(r.z);
    return mat3(cy*cz, cy*sz, -sy,  sx*sy*cz - cx*sz, sx*sy*sz + cx*cz, sx*cy,  cx*sy*cz + sx*sz, cx*sy*sz - sx*cz, cx*cy);

    float f = floor(iFrame + 0.5), col = mod(f, uTiles.x), row = uTiles.y - 1.0 - floor(f / uTiles.x);
    return (uv + vec2(col, row)) / uTiles;
  }`;
const PARTICLE_VERT = VERT_COMMON + /* glsl */`
  void main() {

    vec2 c = position.xy; float s = sin(iRot.z), co = cos(iRot.z);
    if (uMode == 4) {  // mesh
      vec3 p = rotXYZ(iRot) * (position * iSize);
      gl_Position = projectionMatrix * viewMatrix * vec4(iOffset + p, 1.0); return;
    }
    vec2 rc = vec2(c.x * co - c.y * s, c.x * s + c.y * co) * iSize.xy;
    if (uMode == 2) {  // horizontal: flat on the ground
      gl_Position = projectionMatrix * viewMatrix * vec4(iOffset + vec3(rc.x, 0.0, rc.y), 1.0); return;
    }
    if (uMode == 3) {  // vertical: faces the camera, stays upright
      vec3 right = normalize(vec3(viewMatrix[0][0], 0.0, viewMatrix[2][0]));
      gl_Position = projectionMatrix * viewMatrix * vec4(iOffset + right * rc.x + vec3(0.0, rc.y, 0.0), 1.0); return;
    }
    vec4 mv = viewMatrix * vec4(iOffset, 1.0);

      vec3 v = (viewMatrix * vec4(iVel, 0.0)).xyz; vec2 d = normalize(v.xy + 1e-5);
      float len = iSize.x * (1.0 + length(iVel) * 0.15);

const FRAG = /* glsl */`
  uniform sampler2D uTex; uniform sampler2D uMask; uniform vec3 uRamp[5]; uniform float uRampOn; uniform float uAlpha; uniform float uDissolve;
  uniform sampler2D uDissolveTex;

    float x = clamp(1.0 - g, 0.0, 1.0) * 4.0; int i = int(min(floor(x), 3.0)); float f = x - float(i);

    if (uDissolve >= 0.0) a *= smoothstep(1.0 - uDissolve - 0.05, 1.0 - uDissolve + 0.05, texture2D(uDissolveTex, vUv).r);
    vec3 col = (uRampOn > 0.5 ? ramp(g) : t.rgb) * vColor.rgb;

function vfxMaterial(mat, mode, tiles = [1, 1]) {
  const m = mat || { textures: {}, colors: {}, floats: {} };
  const ramp = [1, 2, 3, 4, 5].map((i) => new THREE.Color(...(m.colors['_MatColor' + i] || [1, 1, 1]).slice(0, 3)));
  const rampOn = m.colors._MatColor1 && ramp.some((c) => c.r + c.g + c.b < 2.9) ? 1 : 0;
  const alphaBlend = m.floats._BlendMode === 1 || m.shader === 'Gryphon/VFXOpaque';
  return new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: tex(m.textures._EmissiveTex || m.textures._BaseMap || m.textures._MainTex) },
      uMask: { value: tex(m.textures._MaskTex) }, uDissolveTex: { value: tex(m.textures._DissolveTex) },
      uRamp: { value: ramp }, uRampOn: { value: rampOn }, uAlpha: { value: m.floats._DissolveAlphaMult ?? 1 },
      uDissolve: { value: mode === 5 ? (m.floats._MaterialDissolve ?? 1) : -1 },
      uTiles: { value: new THREE.Vector2(...tiles) }, uMode: { value: mode },

    vertexShader: PARTICLE_VERT, fragmentShader: FRAG, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: alphaBlend ? THREE.OneMinusSrcAlphaFactor : THREE.OneFactor,
  });

// ---- Unity -> three (x mirrored, like the other exports) -----------------------------------------------------------
const v3 = (p) => new THREE.Vector3(-p[0], p[1], p[2]);
const qt = (q) => new THREE.Quaternion(q[0], -q[1], -q[2], q[3]);
const eulerQ = (e) => {  // Unity euler degrees, applied Z, X, Y
  const r = THREE.MathUtils.degToRad, q = new THREE.Quaternion();
  q.setFromEuler(new THREE.Euler(r(e[0]), r(-e[1]), r(-e[2]), 'YXZ')); return q;
};

// ---- particle systems -------------------------------------------------------------------------------------------
const objLoader = new OBJLoader(), meshCache = {};
async function meshGeometry(name) {
  if (!meshCache[name]) meshCache[name] = objLoader.loadAsync('meshes/' + name).then((o) => {
    let g = null; o.traverse((c) => { if (c.isMesh && !g) g = c.geometry; }); return g;
  }).catch(() => null);
  return meshCache[name];
}
const MODES = { billboard: 0, stretched: 1, horizontal: 2, vertical: 3, mesh: 4 };

class Emitter {

    const r = node.renderer || {}; this.mode = MODES[r.mode] ?? 0;
    const uv = this.ps.UVModule; this.tiles = uv ? [uv.tilesX || 1, uv.tilesY || 1] : [1, 1];
    this.max = Math.min(this.ps.InitialModule.maxNumParticles || 1000, 2000);

    const ig = new THREE.InstancedBufferGeometry().copy(geo); ig.instanceCount = 0;
    const attr = (name, n) => { const a = new THREE.InstancedBufferAttribute(new Float32Array(this.max * n), n); a.setUsage(THREE.DynamicDrawUsage); ig.setAttribute(name, a); return a; };
    this.a = { off: attr('iOffset', 3), size: attr('iSize', 3), rot: attr('iRot', 3), color: attr('iColor', 4), frame: attr('iFrame', 1), vel: attr('iVel', 3) };

        size: init.size3D ? [mm(init.startSize, nt, r), mm(init.startSizeY, nt, r), mm(init.startSizeZ, nt, r)] : [size, size, size],
        rot: [init.rotation3D ? mm(init.startRotationX, nt) : 0, init.rotation3D ? mm(init.startRotationY, nt) : 0, -mm(init.startRotation, nt)],

// ---- effect -----------------------------------------------------------------------------------------------------
let effect = null, t = 0, paused = false, playing = true;
async function loadEffect(row) {
  if (effect) { effect.root.removeFromParent(); for (const e of effect.emitters) { e.mesh?.removeFromParent(); } }
  const pf = await (await fetch(row.file)).json();
  const nodes = {}, emitters = [], meshes = [];
  const starts = {};  // Timeline ControlTrack clip name -> start time
  let duration = 0;
  const build = (n, path) => {
    const o = new THREE.Object3D(); o.name = n.name;
    if (n.position) o.position.copy(v3(n.position));
    if (n.rotation) o.quaternion.copy(qt(n.rotation));
    if (n.scale) o.scale.set(...n.scale);
    nodes[path] = o; o.userData.base = { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() };
    if (n.timeline) for (const tr of n.timeline.tracks || []) for (const c of tr.clips || []) {
      if (tr.type === 'ControlTrack' && c.name) starts[c.name] = Math.min(starts[c.name] ?? 1e9, c.start);
      duration = Math.max(duration, c.start + c.duration);

      emitters.push(e);

    }

    // built-in quad)

    const mat0 = n.meshRenderer?.materials?.[0];
    if ((n.active === false && !(n.name in starts)) || n.enabled === false || /test/i.test(n.name)
        || /Universal Render Pipeline\/Lit/.test(mat0?.shader || '') || /placeholder/i.test(mat0?.name || '')) o.visible = false;
    o.userData.base.visible = o.visible;

  });
  for (const [o, mr] of meshes) {
    const g = mr.mesh ? await meshGeometry(mr.mesh) : new THREE.PlaneGeometry(1, 1); if (!g) continue;
    const mat = vfxMaterial(mr.materials[0], 5); mat.uniforms.uMode.value = 4;  // (5 = a mesh renderer: dissolve on)
    mat.userData.defaults = { d: mat.uniforms.uDissolve.value, a: mat.uniforms.uAlpha.value };
    const ig = new THREE.InstancedBufferGeometry().copy(g); ig.instanceCount = 1;
    const one = (name, vals) => ig.setAttribute(name, new THREE.InstancedBufferAttribute(new Float32Array(vals), vals.length));
    one('iOffset', [0, 0, 0]); one('iSize', [1, 1, 1]); one('iRot', [0, 0, 0]); one('iColor', [1, 1, 1, 1]); one('iFrame', [0]); one('iVel', [0, 0, 0]);
    mat.vertexShader = mat.vertexShader.replace('gl_Position = projectionMatrix * viewMatrix * vec4(iOffset + p, 1.0); return;',
      'gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); return;');
    const m = new THREE.Mesh(ig, mat); m.frustumCulled = false; o.add(m); o.userData.mat = mat;
  }
  await Promise.all(emitters.map((e) => e.ready));
  for (const c of pf.clips || []) duration = Math.max(duration, (c.timelineStart ?? 0) + c.duration);
  effect = { pf, row, root, nodes, emitters, clips: pf.clips || [], duration: Math.max(duration, 1), fitted: false };
  window.__effect = effect;
  ui('info').textContent = `${row.prefab} (${row.bundle})  ${row.role}${row.ability ? ' · ' + row.ability : ''} · ${emitters.length} particle systems, ` +
    `${effect.clips.length} clips, ${effect.duration.toFixed(2)} s` + (row.skinned ? '  (body copies are not drawn)' : '');
  restart();
}
function findNode(path) {
  if (!effect) return null;
  if (path === '' || typeof path === 'number') return path === '' ? effect.root : null;
  if (effect.nodes[path]) return effect.nodes[path];
  for (const k in effect.nodes) if (k.endsWith('/' + path)) return effect.nodes[k];
  return null;
}
function applyClips(time) {
  for (const c of effect.clips) {
    if (!c.curves) continue;
    const local = c.timelineStart == null ? time % Math.max(c.duration, 0.01) : time - c.timelineStart;
    if (local < 0 || local > c.duration + 0.001) continue;
    const i = Math.min(Math.round(local * c.rate), 1e9);
    for (const cv of c.curves) {
      const o = findNode(cv.path); if (!o) continue;
      const v = 'const' in cv ? cv.const : cv.values?.[Math.min(i, cv.values.length - 1)];
      if (v == null) continue;
      if (cv.component === 'Transform') {
        if (cv.property === 'position') o.position.copy(v3(v));
        else if (cv.property === 'rotation') o.quaternion.copy(qt(v)).normalize();
        else if (cv.property === 'euler') o.quaternion.copy(eulerQ(v));
        else if (cv.property === 'scale') o.scale.set(...v);
      } else if (cv.property === 'm_IsActive') o.visible = v > 0.5;
      else if (typeof cv.property === 'string' && cv.property.startsWith('material.')) {
        const mats = [o.userData.mat, ...effect.emitters.filter((e) => e.obj === o).map((e) => e.mesh?.material)].filter(Boolean);
        for (const m of mats) {
          if (cv.property === 'material._MaterialDissolve') m.uniforms.uDissolve.value = v;
          if (cv.property === 'material._DissolveAlphaMult') m.uniforms.uAlpha.value = v;
        }
      }
    }
  }
}

// ---- sounds -----------------------------------------------------------------------------------------------------
function soundsFor(row) {
  const rows = index.sounds?.[ui('unit').value] || [];
  return rows.filter((s) => row.ability ? s.ability === row.ability : false);
}
function playSounds(row) {
  if (!ui('sound').checked) return;
  for (const s of soundsFor(row)) {
    const files = s.files?.sfx?.length ? s.files.sfx : s.files?.['en-US'] || [];
    if (!files.length) continue;
    const late = s.activity === 'Detached' || s.trigger === 'ImpactSound';
    setTimeout(() => { const a = new Audio('sounds/' + files[Math.floor(Math.random() * files.length)]); a.volume = 0.6; a.play().catch(() => {}); },
      (late ? 400 : 0) / Number(ui('speed').value));
  }
}

// frame the effect once it has spread out: its particles and meshes
function fitCamera() {
  effect.fitted = true;
  const box = new THREE.Box3(), v = new THREE.Vector3();
  for (const e of effect.emitters) {
    const a = e.a?.off; if (!a) continue;
    for (let i = 0; i < e.mesh.geometry.instanceCount; i++) box.expandByPoint(v.fromBufferAttribute(a, i));
  }
  const shown = (o) => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
  effect.root.traverse((o) => { if (o.isMesh && shown(o)) box.expandByObject(o); });
  if (box.isEmpty()) box.setFromCenterAndSize(new THREE.Vector3(0, 1, 0), new THREE.Vector3(3, 3, 3));
  const mid = box.getCenter(new THREE.Vector3()), r = Math.max(box.getSize(new THREE.Vector3()).length() * 0.6, 2);
  controls.target.copy(mid); camera.position.set(mid.x + r * 1.1, mid.y + r * 0.8, mid.z + r * 1.6); controls.update();
}

// ---- ui / loop --------------------------------------------------------------------------------------------------
function restart() {
  t = 0; playing = true;
  for (const e of effect.emitters) e.reset();
  effect.root.traverse((o) => { const b = o.userData.base; if (b) { o.position.copy(b.p); o.quaternion.copy(b.q); o.scale.copy(b.s); o.visible = b.visible ?? true; }
    const d = o.userData.mat?.userData.defaults; if (d) { o.userData.mat.uniforms.uDissolve.value = d.d; o.userData.mat.uniforms.uAlpha.value = d.a; } });
  playSounds(effect.row);
}
function fillEffects() {
  const rows = index.units[ui('unit').value].filter((r) => r.file && (r.particles || r.clips || (!r.skinned && r.meshes)));
  ui('effect').innerHTML = '';
  const seen = new Set();
  for (const r of rows) {
    if (seen.has(r.prefab)) continue; seen.add(r.prefab);
    ui('effect').add(new Option(`${r.ability || '-'} · ${r.role} · ${r.prefab}`, r.prefab));
  }
}
const rowFor = (prefab) => index.units[ui('unit').value].find((r) => r.prefab === prefab);
ui('unit').onchange = () => { fillEffects(); loadEffect(rowFor(ui('effect').value)); };
ui('effect').onchange = () => loadEffect(rowFor(ui('effect').value));
ui('play').onclick = () => effect && restart();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
function step(dt) {
  if (!effect || !playing) return;
  t += dt;
  applyClips(t);
  effect.root.updateMatrixWorld(true);
  for (const e of effect.emitters) e.update(t, dt);
  if (!effect.fitted && t > Math.min(0.4, effect.duration * 0.4)) fitCamera();
  if (t > effect.duration) { if (ui('loop').checked) restart(); else playing = false; }
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05) * Number(ui('speed').value);
  if (!paused) step(dt);
  controls.update(); renderer.render(scene, camera);
});

ui('unit').value = params.get('unit') && index.units[params.get('unit')] ? params.get('unit') : 'priestess';
fillEffects();
if (params.get('prefab') && rowFor(params.get('prefab'))) ui('effect').value = params.get('prefab');
await loadEffect(rowFor(ui('effect').value));
if (params.has('t')) { paused = true; ui('loop').checked = false; const T = Number(params.get('t')); for (let x = 0; x < T; x += 1 / 60) step(1 / 60); }
window.__ready = true;
</script>
</body>
</html>

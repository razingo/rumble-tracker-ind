<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dash sprite render</title>
<style>
  body { margin: 0; background: #2b3550; color: #ddd; font: 13px system-ui, sans-serif; }
  #log { position: fixed; top: 0; right: 0; padding: 6px 10px; background: #000a; white-space: pre; max-height: 40vh; overflow: auto; }
  #sheet { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  #sheet figure { margin: 0; text-align: center; background: #7fae6a; border-radius: 6px; padding: 4px; }
  #sheet img { display: block; max-width: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="log"></div>
<div id="sheet"></div>
<script type="module">
// Renders each sprite in sprites.json: a unit from its rigged model (animations/index.json), in frames of its walk,
// attack and idle clips; a tower from its model (models/index.json). A toy-figure look, lit from the front-left, at a
// three-quarter side angle facing right, with a dark outline. Saves sprites/<id>.png (a sheet of frames) and
// sprites/index.json (how to cut each sheet) through the helper server.
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

THREE.ColorManagement.enabled = false;
const log = (t) => { document.getElementById('log').textContent += t + '\n'; window.__log = (window.__log || '') + t + '\n'; };
const params = new URLSearchParams(location.search);
const SIZE = 1024; // render size before cropping
const OUT_H = Number(params.get('height') || 128); // height of a figure of scale 1
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setSize(SIZE, SIZE, false);
renderer.setClearColor(0x000000, 0);

const index = await (await fetch('models/index.json')).json();
const rigs = await (await fetch('animations/index.json')).json();
const config = await (await fetch('sprites.json')).json();
// parts of a unit's model that aren't the figure itself
const EXTRAS = /Missile|Graves|LOD1|Pile|Meat|Glow|Poison|Potion|Path|Base_|Meteor|Raid|WingsOpen|Boots|AirDrop|Tree/i;
// frames per second of a clip, and the fewest and most frames an animation gets
const RATE = 24, FRAMES = { move: [12, 30], attack: [12, 30], idle: [8, 14], death: [6, 14], deploy: [6, 12], cast: [8, 20], charge: [8, 14] };
// animations that play once, from the clip's first moment to its last
const ONCE = ['attack', 'death', 'deploy', 'cast'];
// the clips to use when sprites.json names none: the first one a unit has, in this order
const CLIPS = {
  move: [/^Walk$/, /^Fly$/, /^Move$/, /^Glide$/, /^Run$/],
  attack: [/Hit$/, /Melee/, /Cleave|Chop|Bash|Swing/, /Throw|Shot|Ranged|Smite|Splash|Wrath|Cast/, /^Ability/],
  idle: [/^Ready$/, /^Stand$/],
  death: [/^Death$/],
  deploy: [/^DeployEndd?$/, /^Deploy$/],
  cast: [], charge: [], // only where sprites.json names a clip
};
const textures = new Map();
const texture = (url) => {
  if (!textures.has(url)) {
    textures.set(url, new THREE.TextureLoader().loadAsync(url).then((t) => {
      t.colorSpace = THREE.NoColorSpace;
      return t;
    }));
  }
  return textures.get(url);
};
const lambert = (map) => new THREE.MeshLambertMaterial({ map, color: map ? 0xffffff : 0xb8b8b8, side: THREE.DoubleSide, alphaTest: 0.4 });
const plain = (s) => s.replace(/[[\].:/\s]/g, '').replace(/_[0-9]+$/, ''); // node names as GLTFLoader keeps them

// A unit: its rigged model (animations/<file>.glb) and the frames to draw, each { anim, set() } where set() puts the
// skeleton in that frame's pose. spec.parts lists the meshes to show (default: all but the extras, or those not
// matching spec.hide); spec.still keeps the figure in one place when its clips carry it around; spec.move, spec.attack, spec.idle, spec.death, spec.deploy, spec.cast and spec.charge name the clips ("A+B" plays two at once, such as a mount's
// and its rider's; false leaves that animation out).
async function buildUnit(spec) {
  const file = spec.file || rigs.units[spec.unit]?.file;
  if (!file) throw new Error(`no rigged model for ${spec.unit}`);
  const gltf = await new GLTFLoader().loadAsync(`animations/${file}`);
  const wanted = spec.parts?.map(plain);
  const hide = spec.hide ? new RegExp(spec.hide, 'i') : EXTRAS;
  const meshes = [];
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const names = [o.name, o.parent?.name || ''];
    o.visible = wanted ? names.some((n) => wanted.includes(plain(n))) : !names.some((n) => hide.test(n));
    if (!o.visible) return;
    const map = o.material.map;
    if (map) { map.colorSpace = THREE.NoColorSpace; map.needsUpdate = true; }
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = lambert(map);
    o.frustumCulled = false;
    meshes.push(o);
  });
  if (!meshes.length) throw new Error('no meshes');
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const pick = (anim) => {
    if (spec[anim] === false) return null;
    const names = spec[anim] ? spec[anim].split('+')
      : [CLIPS[anim].map((re) => gltf.animations.find((c) => re.test(c.name))).find(Boolean)?.name];
    const clips = names.map((n) => gltf.animations.find((c) => c.name === n));
    if (spec[anim] && clips.some((c) => !c)) throw new Error(`no clip ${spec[anim]}`);
    return clips[0] ? clips : null;
  };
  const frames = [], anims = {};
  for (const anim of Object.keys(FRAMES)) {
    const clips = pick(anim);
    if (!clips) continue;
    if (anim === 'death' && clips[0].duration > 1.5) continue; // a leader's long last scene, not a fall
    // an attack is drawn whole: the game lands the hit part-way through it
    const [from, to] = spec[`${anim}Range`] || [0, 1];
    const [fewest, most] = FRAMES[anim];
    const n = clips[0].duration < 0.1 ? 1
      : (spec.frames?.[anim] ?? Math.max(fewest, Math.min(most, Math.round(clips[0].duration * (to - from) * RATE))));
    anims[anim] = [frames.length, n, Math.round(clips[0].duration * (to - from) * 1000) / 1000];
    for (let i = 0; i < n; i++) {
      const at = from + (to - from) * (ONCE.includes(anim) && n > 1 ? i / (n - 1) : i / n);
      frames.push({ anim, set() {
        mixer.stopAllAction();
        for (const c of clips) { const a = mixer.clipAction(c); a.play(); a.time = Math.min(c.duration * at, c.duration - 1e-4); }
        mixer.update(0);
      } });
    }
  }
  // nothing moves it: one frame, as the model stands
  if (!frames.length) { frames.push({ anim: 'move', set() {} }); anims.move = [0, 1, 0]; }
  return { group: gltf.scene, meshes, frames, anims };
}

// A tower (spec.structure), or loose parts of a unit's model such as a thrown weapon (spec.model): its meshes from
// models/index.json, each a name or { mesh, at: [x, y, z] } (the pieces come without their place on the tower). One frame.
async function buildStructure(spec) {
  const entry = spec.model ? index.units[spec.model]?.battle : index.structures[spec.structure];
  if (!entry) throw new Error(`no model ${spec.model || spec.structure}`);
  const group = new THREE.Group(), meshes = [];
  for (const p of spec.parts.map((q) => (typeof q === 'string' ? { mesh: q } : q))) {
    const m = entry.meshes.find((o) => o.mesh === p.mesh);
    if (!m) continue;
    const obj = await new OBJLoader().loadAsync(`models/${m.obj}`);
    const map = m.color ? await texture(`models/${m.obj.slice(0, m.obj.lastIndexOf('/') + 1)}${m.color}`) : null;
    obj.traverse((o) => {
      if (!o.isMesh) return;
      o.geometry.computeVertexNormals();
      o.material = lambert(map);
      meshes.push(o);
    });
    if (p.at) obj.position.set(...p.at);
    group.add(obj);
  }
  if (!meshes.length) throw new Error('no meshes');
  return { group, meshes, frames: [{ anim: 'move', set() {} }], anims: { move: [0, 1, 0] } };
}

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a08c, 2.6));
const sun = new THREE.DirectionalLight(0xfff2dc, 1.6);
sun.position.set(-2, 4, 5);
scene.add(sun);

// Renders every frame of a sprite with one camera, so the figure keeps its size and place from frame to frame, and
// lays the frames out on a sheet. Returns { sheet, info }; info is what the game needs to draw a frame:
// { cell: [w, h], cols, at: [x, y] (the feet, within a cell), body (the standing figure's height), anims }, and for a
// unit its size in the game (animations/index.json: spec.size names the entry when a unit has several): tall (the
// height of the figure as drawn in its first frame, at the game's scale, in world units) and radius (its collider).
async function renderOne(id, spec) {
  const { group, meshes, frames, anims } = await (spec.structure || spec.model ? buildStructure(spec) : buildUnit(spec));
  // the figure faces +z in its model; turned to face right, a little toward the camera
  const pivot = new THREE.Group();
  pivot.add(group);
  pivot.rotation.y = THREE.MathUtils.degToRad(spec.yaw ?? 62);
  scene.add(pivot);
  const bounds = () => {
    pivot.updateMatrixWorld(true);
    const box = new THREE.Box3(), b = new THREE.Box3();
    for (const m of meshes) {
      if (m.isSkinnedMesh) { m.computeBoundingBox(); b.copy(m.boundingBox); }
      else { if (!m.geometry.boundingBox) m.geometry.computeBoundingBox(); b.copy(m.geometry.boundingBox); }
      box.union(b.applyMatrix4(m.matrixWorld));
    }
    return box;
  };
  // A deploy clip carries the figure in from far off, and a death can throw it; their frames are drawn on the first frame's spot instead (the
  // game moves the unit in), so they stay as sharp and as small on the sheet as the rest.
  frames[0].set();
  const b0 = bounds(), home = [(b0.min.x + b0.max.x) / 2, b0.min.y, (b0.min.z + b0.max.z) / 2];
  const place = (f) => {
    pivot.position.set(0, 0, 0);
    f.set();
    if (f.anim !== 'deploy' && f.anim !== 'death') return;
    const b = bounds();
    pivot.position.set(home[0] - (b.min.x + b.max.x) / 2, home[1] - b.min.y, home[2] - (b.min.z + b.max.z) / 2);
  };
  // A deploy also stretches the figure like a rubber toy as it drops, many times its height at first: the camera
  // leaves room for half as tall again, and frames stretched past that are left out below.
  const STRETCH = 1.5;
  const all = new THREE.Box3();
  for (const f of frames) if (f.anim !== 'deploy') { place(f); all.union(bounds()); }
  if (frames.some((f) => f.anim === 'deploy')) all.max.y = Math.max(all.max.y, b0.min.y + (b0.max.y - b0.min.y) * STRETCH);
  const sizes = (spec.unit && rigs.units[spec.unit]?.size) || [];
  const size = sizes.find((z) => z.unit === spec.size) || sizes[0];
  const c = all.getCenter(new THREE.Vector3()), s = all.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z) * 0.72;
  const cam = new THREE.OrthographicCamera(-r, r, r, -r, 0.01, r * 20);
  const pitch = THREE.MathUtils.degToRad(spec.pitch ?? 12);
  cam.position.set(c.x, c.y + Math.sin(pitch) * r * 5, c.z + Math.cos(pitch) * r * 5);
  cam.lookAt(c);

  const shots = [];
  for (const f of frames) {
    place(f);
    renderer.render(scene, cam);
    const src = document.createElement('canvas');
    src.width = src.height = SIZE;
    const sc = src.getContext('2d', { willReadFrequently: true });
    sc.drawImage(renderer.domElement, 0, 0);
    const px = sc.getImageData(0, 0, SIZE, SIZE).data;
    let x0 = SIZE, y0 = SIZE, x1 = -1, y1 = -1;
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (px[(y * SIZE + x) * 4 + 3] > 24) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    // a frame with the figure gone (burrowed, not yet out of the ground) stays an empty cell
    if (x1 < 0) {
      if (!shots.length) throw new Error('nothing drawn');
      ({ x0, y0, x1, y1 } = shots[0]);
    }
    // an over-stretched deploy frame (or one cut off by the edge of the view) is dropped
    const tall = shots.length ? (shots[0].y1 - shots[0].y0 + 1) * STRETCH : Infinity;
    if (f.anim === 'deploy' && (y1 - y0 + 1 > tall || y0 <= 0)) continue;
    shots.push({ src, x0, y0, x1, y1, anim: f.anim });
  }
  // the animations as they are on the sheet now
  let at = 0;
  for (const [name, v] of Object.entries(anims)) {
    const n = shots.filter((f) => f.anim === name).length;
    if (n) anims[name] = [at, n, Math.round(v[2] * n / v[1] * 1000) / 1000]; else delete anims[name];
    at += n;
  }
  scene.remove(pivot);
  for (const m of meshes) { m.geometry.dispose(); m.material.dispose(); }

  // one cell fits every frame; the first frame gives the figure's height and where its feet are
  const first = shots[0], pad = 4;
  let x0 = Math.min(...shots.map((f) => f.x0)), y0 = Math.min(...shots.map((f) => f.y0));
  let bw = Math.max(...shots.map((f) => f.x1)) - x0 + 1, bh = Math.max(...shots.map((f) => f.y1)) - y0 + 1;
  for (const f of shots) { f.cx = x0; f.cy = y0; }
  if (spec.still) {
    // every frame on the first one's spot: the middle of its feet
    const left = Math.max(...shots.map((f) => (f.x1 - f.x0 + 1) / 2)), up = Math.max(...shots.map((f) => f.y1 - f.y0 + 1));
    bw = Math.ceil(left * 2); bh = up;
    for (const f of shots) { f.cx = (f.x0 + f.x1 + 1) / 2 - left; f.cy = f.y1 + 1 - up; }
    x0 = first.cx; y0 = first.cy;
  }
  const k = OUT_H * (spec.scale ?? 1) / (first.y1 - first.y0 + 1);
  const w = Math.round(bw * k), h = Math.round(bh * k);
  const cw = w + pad * 2, ch = h + pad * 2;
  // as many columns as keep the sheet near square, so no side gets too long for a phone to load
  const cols = Math.min(shots.length, Math.max(1, Math.ceil(Math.sqrt(shots.length * ch / cw))));
  const sheet = document.createElement('canvas');
  sheet.width = cw * cols; sheet.height = ch * Math.ceil(shots.length / cols);
  const oc = sheet.getContext('2d');
  oc.imageSmoothingQuality = 'high';
  const sil = document.createElement('canvas');
  sil.width = cw; sil.height = ch;
  const sl = sil.getContext('2d');
  sl.imageSmoothingQuality = 'high';
  shots.forEach((f, i) => {
    const ox = (i % cols) * cw, oy = Math.floor(i / cols) * ch;
    // the outline: the figure's dark silhouette, drawn around it
    sl.globalCompositeOperation = 'source-over';
    sl.clearRect(0, 0, cw, ch);
    sl.drawImage(f.src, f.cx, f.cy, bw, bh, pad, pad, w, h);
    sl.globalCompositeOperation = 'source-in';
    sl.fillStyle = '#2a2233';
    sl.fillRect(0, 0, cw, ch);
    for (let a = 0; a < 16; a++) oc.drawImage(sil, ox + Math.cos(a * Math.PI / 8) * 2.5, oy + Math.sin(a * Math.PI / 8) * 2.5);
    oc.drawImage(f.src, f.cx, f.cy, bw, bh, ox + pad, oy + pad, w, h);
  });
  const info = { cell: [cw, ch], cols,
    at: [Math.round(((first.x0 + first.x1 + 1) / 2 - x0) * k) + pad, Math.round((first.y1 + 1 - y0) * k) + pad],
    body: Math.round((first.y1 - first.y0 + 1) * k), anims };
  if (size) {
    // measured in the picture, so a unit drawn 'tall' high is at the game's scale whatever its shape or pose
    info.tall = Math.round((first.y1 - first.y0 + 1) * (2 * r / SIZE) * (size.scale ?? 1) * 100) / 100;
    if (size.radius) info.radius = size.radius;
  }
  return { sheet, info };
}

// A backdrop layer: a map scene (maps/scenes/<version>.glb) seen from the side and a little from above, its long side
// across the picture, in its own colors with part of its baked light, on a clear background and cut to what is drawn.
// hide/show (regex on mesh and material names) pick the props, depth: [from, to] keeps a slice of the map (0 = the far
// side, 1 = the near side), yaw turns the map. Every layer of a map has the same scale. tops and ground are
// explained below. Saves sprites/bg-<name>.png.
async function renderBackdrop(name, spec) {
  const gltf = await new GLTFLoader().loadAsync(`maps/scenes/${spec.scene}.glb`);
  const OVERLAY = /fog|mist|cloud|vignette|unwalkable|walkable|blocker|mask|haze|godray|lightray|shadowcatcher|water_?caustic/i;
  const strength = spec.light ?? 0;
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const mats = [].concat(o.material);
    if (mats.every((m) => !m.map && OVERLAY.test(m.name + ' ' + o.name))) { o.visible = false; return; }
    const convert = (m) => {
      for (const t of [m.map, m.aoMap]) if (t) { t.colorSpace = THREE.NoColorSpace; t.needsUpdate = true; }
      const out = new THREE.MeshBasicMaterial({ map: m.map, color: m.color, transparent: m.transparent, opacity: m.opacity,
        alphaTest: m.alphaTest, side: THREE.DoubleSide, depthWrite: !m.transparent });
      out.name = m.name;
      if (m.aoMap && strength > 0) { out.lightMap = m.aoMap; out.lightMapIntensity = 2 * strength; out.color = m.color.clone().multiplyScalar(1 - strength); }
      return out;
    };
    o.material = Array.isArray(o.material) ? mats.map(convert) : convert(o.material);
  });
  const world = new THREE.Scene();
  const pivot = new THREE.Group();
  pivot.add(gltf.scene);
  pivot.rotation.y = THREE.MathUtils.degToRad(spec.yaw ?? 90);
  world.add(pivot);
  pivot.updateMatrixWorld(true);
  const all = new THREE.Box3().setFromObject(pivot);
  const hide = spec.hide && new RegExp(spec.hide, 'i'), show = spec.show && new RegExp(spec.show, 'i');
  const [from, to] = spec.depth || [0, 1];
  const box = new THREE.Box3();
  const label = (o) => o.name + ' ' + [].concat(o.material).map((m) => m.name).join(' ');
  const [top, trunk] = spec.tops ? spec.tops.map((r) => new RegExp(r, 'i')) : [];
  const ground = spec.ground && new RegExp(spec.ground, 'i');
  let floor = null, model = null;
  const standing = [], trunks = [];
  pivot.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    const l = label(o), b = new THREE.Box3().setFromObject(o), wide = b.max.x - b.min.x;
    if (ground && ground.test(l)) floor = b.max.y;
    if (top && top.test(l)) {
      // the top closest to a usual size and lying level is the one copied onto the trees
      const fit = Math.abs(wide - 9) + Math.abs(wide - (b.max.z - b.min.z)) * 3;
      if (!model || fit < model.fit) model = { mesh: o, box: b, fit };
      o.visible = false; return;
    }
    const z = ((b.min.z + b.max.z) / 2 - all.min.z) / (all.max.z - all.min.z);
    if ((hide && hide.test(l)) || (show && !show.test(l)) || z < from || z > to) { o.visible = false; return; }
    if (trunk && trunk.test(l)) trunks.push(o);
    standing.push(b);
    box.union(b);
  });
  // tops: [top, trunk]. A map sets its tree tops for a view from above, so from the side many hang beside the branches
  // or leave one bare. They are left out, and every branch end of a trunk gets its own top instead: a branch end is a
  // point of the trunk with nothing higher around it; the highest one gets the biggest top.
  if (model) {
    const shape = model.mesh.geometry.clone().applyMatrix4(model.mesh.matrixWorld), mb = model.box;
    shape.translate(-(mb.min.x + mb.max.x) / 2, -mb.min.y, -(mb.min.z + mb.max.z) / 2);
    const mw = mb.max.x - mb.min.x, mh = mb.max.y - mb.min.y;
    for (const t of trunks) {
      const at = t.geometry.attributes.position, points = [];
      for (let i = 0; i < at.count; i++) points.push(new THREE.Vector3().fromBufferAttribute(at, i).applyMatrix4(t.matrixWorld));
      const lowest = Math.min(...points.map((p) => p.y)), tall = Math.max(...points.map((p) => p.y)) - lowest;
      const flat = (p, q) => Math.hypot(p.x - q.x, p.z - q.z), apart = tall * 0.16;
      const ends = [];
      for (const p of points) {
        if (p.y < lowest + tall * 0.5 || points.some((q) => q.y > p.y + 0.01 && flat(p, q) < apart)) continue;
        if (!ends.some((e) => flat(e, p) < apart)) ends.push(p);
      }
      ends.sort((p, q) => q.y - p.y);
      for (const [i, e] of ends.entries()) {
        const k = tall * (i ? 0.62 : 0.9) / mw;
        const cap = new THREE.Mesh(shape, model.mesh.material);
        cap.scale.setScalar(k);
        cap.position.set(e.x, e.y - mh * k * 0.3, e.z);
        world.add(cap);
        cap.updateMatrixWorld(true);
        box.union(new THREE.Box3().setFromObject(cap));
      }
      log(`  ${name}: tree with ${ends.length} tops`);
    }
  }
  // ground: the mesh the props stand on. It is not drawn; what is buried under it is cut off, and each prop gets a soft
  // shadow on it, so nothing seems to float.
  renderer.clippingPlanes = floor == null ? [] : [new THREE.Plane(new THREE.Vector3(0, 1, 0), -floor)];
  if (floor != null) {
    const spot = document.createElement('canvas'); spot.width = spot.height = 64;
    const sx = spot.getContext('2d'), fade = sx.createRadialGradient(32, 32, 0, 32, 32, 32);
    fade.addColorStop(0, 'rgba(0,0,0,0.5)'); fade.addColorStop(0.6, 'rgba(0,0,0,0.3)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
    sx.fillStyle = fade; sx.fillRect(0, 0, 64, 64);
    const dark = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(spot), transparent: true, depthWrite: false });
    for (const b of standing) {
      const wide = Math.max(b.max.x - b.min.x, b.max.z - b.min.z);
      if (wide < 1.5 || b.min.y > floor + 1) continue;
      const shadow = new THREE.Mesh(new THREE.CircleGeometry(wide * 0.6, 24), dark);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.set((b.min.x + b.max.x) / 2, floor + 0.03, (b.min.z + b.max.z) / 2);
      shadow.renderOrder = -1;
      world.add(shadow);
    }
  }
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const pitch = THREE.MathUtils.degToRad(spec.pitch ?? 32);
  const halfW = (all.max.x - all.min.x) / 2 * (spec.zoom ? 1 / spec.zoom : 1);
  c.x = (all.min.x + all.max.x) / 2;
  const w = spec.width || 2400, h = spec.height || 700, halfH = halfW * h / w;
  const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 5000);
  const d = Math.max(size.x, size.z) * 2;
  cam.position.set(c.x, c.y + Math.sin(pitch) * d + (spec.up ?? 0), c.z + Math.cos(pitch) * d);
  cam.lookAt(c.x, c.y + (spec.up ?? 0), c.z);
  renderer.setSize(w, h, false);
  renderer.render(world, cam);
  // cut the picture to what is drawn
  const full = document.createElement('canvas'); full.width = w; full.height = h;
  const fx = full.getContext('2d'); fx.drawImage(renderer.domElement, 0, 0);
  const px = fx.getImageData(0, 0, w, h).data;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 8) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) throw new Error('nothing drawn');
  const cut = document.createElement('canvas'); cut.width = x1 - x0 + 1; cut.height = y1 - y0 + 1;
  cut.getContext('2d').drawImage(full, -x0, -y0);
  const blob = await new Promise((r) => cut.toBlob(r, 'image/png'));
  if (params.has('sheet')) {
    const im = new Image(); im.src = URL.createObjectURL(blob); im.style.cssText = 'height:auto;width:100%';
    document.getElementById('sheet').append(im);
  } else await fetch(`/save/bg-${name}.png`, { method: 'POST', body: blob });
  renderer.setSize(SIZE, SIZE, false);
  renderer.clippingPlanes = [];
  log(`bg-${name}: ${cut.width}x${cut.height}`);
}
if (params.has('backdrops')) {
  for (const [name, spec] of Object.entries(config.backdrops || {})) {
    if (params.get('backdrops') && !params.get('backdrops').split(',').includes(name)) continue;
    try { await renderBackdrop(name, spec); } catch (e) { log(`bg-${name}: FAILED ${e.message}`); }
  }
  // Grounds: a piece of a map's painted terrain (crop: [x, y, w, h] of its texture, the lane running down it), turned so
  // the lane runs left to right. Saves sprites/bg-<name>.png; the game lays it flat under the units.
  for (const [name, g] of Object.entries(config.grounds || {})) {
    if (params.get('backdrops') && !params.get('backdrops').split(',').includes(name)) continue;
    try {
      const im = new Image();
      im.src = g.texture;
      await im.decode();
      const [x, y, w, h] = g.crop, c = document.createElement('canvas');
      c.width = h; c.height = w;
      const cx = c.getContext('2d');
      cx.translate(0, w); cx.rotate(-Math.PI / 2);
      cx.drawImage(im, x, y, w, h, 0, 0, w, h);
      const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
      await fetch(`/save/bg-${name}.png`, { method: 'POST', body: blob });
      log(`bg-${name}: ${c.width}x${c.height}`);
    } catch (e) { log(`bg-${name}: FAILED ${e.message}`); }
  }
  log('DONE');
  window.__done = true;
  throw new Error('backdrops only');
}

const only = params.get('only')?.split(',');
const sheet = params.has('sheet');
// rendering some of them keeps the others' entries in the game's index
const infos = sheet ? null : only ? await fetch('/sprites/index.json').then((r) => (r.ok ? r.json() : {}), () => ({})) : {};
for (const [id, spec] of Object.entries(config.sprites)) {
  if (only && !only.includes(id)) continue;
  try {
    const out = await renderOne(id, spec);
    if (sheet) {
      const fig = document.createElement('figure');
      const im = new Image(); im.src = out.sheet.toDataURL();
      fig.append(im, `${id} ${Object.entries(out.info.anims).map(([a, v]) => `${a} ${v[1]}`).join(', ')}`);
      document.getElementById('sheet').append(fig);
    } else {
      const blob = await new Promise((r) => out.sheet.toBlob(r, 'image/png'));
      await fetch(`/save/${id}.png`, { method: 'POST', body: blob });
      infos[id] = out.info;
    }
    log(`${id}: ${out.sheet.width}x${out.sheet.height} ${JSON.stringify(out.info.anims)}`);
  } catch (e) { log(`${id}: FAILED ${e.message}`); }
}
if (infos) await fetch('/save/index.json', { method: 'POST', body: JSON.stringify(infos) });
log('DONE');
window.__done = true;
</script>
</body>
</html>
